<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d3557" />
  <meta name="description" content="Räkna ner dagarna till din resa eller händelse – och dela med kompisar och familj." />
  <title>Nedräknaren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">

    <!-- ====== NEDRÄKNINGSVY ====== -->
    <section class="screen screen--countdown" id="countdownScreen" hidden>
      <div class="cd-bg" aria-hidden="true">
        <div class="cd-emoji cd-emoji--1"></div>
        <div class="cd-emoji cd-emoji--2"></div>
        <div class="cd-emoji cd-emoji--3"></div>
      </div>

      <div class="cd-content">
        <p class="cd-theme-label" id="cdThemeLabel"></p>
        <h1 class="cd-title" id="cdTitle">Min nedräkning</h1>
        <p class="cd-date" id="cdDate"></p>

        <div class="cd-bignumber" id="cdBigNumber">
          <span class="cd-big-value" id="cdDays">0</span>
          <span class="cd-big-unit" id="cdDaysUnit">dagar kvar</span>
        </div>

        <div class="cd-clock" id="cdClock">
          <div class="cd-unit"><span id="cdHours">0</span><small>tim</small></div>
          <div class="cd-unit"><span id="cdMinutes">0</span><small>min</small></div>
          <div class="cd-unit"><span id="cdSeconds">0</span><small>sek</small></div>
        </div>

        <div class="cd-done" id="cdDone" hidden>
          <p class="cd-done-emoji" id="cdDoneEmoji">🎉</p>
          <p class="cd-done-text">Dagen är här!</p>
        </div>

        <div class="cd-actions">
          <button class="btn btn--light" id="shareBtn" type="button">📤 Dela</button>
          <button class="btn btn--ghost" id="editBtn" type="button">✏️ Ändra</button>
        </div>
      </div>
    </section>

    <!-- ====== SKAPA / REDIGERA-VY ====== -->
    <section class="screen screen--form" id="formScreen">
      <div class="form-wrap">
        <header class="form-header">
          <h1 class="logo">⏳ Nedräknaren</h1>
          <p class="tagline">Räkna ner till din nästa resa eller händelse</p>
        </header>

        <form id="countdownForm" autocomplete="off">
          <label class="field">
            <span class="field-label">Vad räknar du ner till?</span>
            <input
              type="text"
              id="titleInput"
              name="title"
              maxlength="60"
              placeholder="t.ex. Resa till Thailand"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Vilket datum?</span>
            <input type="date" id="dateInput" name="date" required />
          </label>

          <div class="field">
            <span class="field-label">Välj ett tema</span>
            <div class="themes" id="themeGrid" role="radiogroup" aria-label="Tema"></div>
          </div>

          <button class="btn btn--primary" type="submit" id="startBtn">Starta nedräkning 🚀</button>
        </form>

        <div class="saved" id="savedSection" hidden>
          <h2 class="saved-title">Sparade nedräkningar</h2>
          <ul class="saved-list" id="savedList"></ul>
        </div>
      </div>
    </section>

  </main>

  <!-- Liten toast för feedback -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
